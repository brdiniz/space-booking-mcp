[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "space-booking-mcp"
version = "0.1.0"
description = "Reference MCP server for booking shared spaces, with profile-based routing to different booking backends."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2.0,<3", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
space-booking-mcp = "space_booking_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
